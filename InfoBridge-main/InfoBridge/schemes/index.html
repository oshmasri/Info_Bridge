<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InfoBridge | Services</title>

    <!-- Common theme -->
    <link rel="stylesheet" href="../assets/common.css">
    <!-- Page specific -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<header class="navbar">
    <div class="logo-section">
        <img src="../assets/logo.png" alt="InfoBridge">
        <span class="site-name">InfoBridge</span>
    </div>
</header>

<!-- Main -->
<main class="services-container">

    <h1 class="page-title">ServiceBridge</h1>

    <!-- Search -->
    <input type="text" id="searchInput"
           placeholder="Search for a service..."
           class="search-box">

    <!-- Certificates & Documents -->
    <section class="category">
        <h2>Certificates & Documents</h2>
        <div class="service-grid">
            <button class="service-card">Birth Certificate</button>
            <button class="service-card">Caste Certificate</button>
            <button class="service-card">Death Certificate</button>
            <button class="service-card">Driving License</button>
            <button class="service-card">Income Certificate</button>
            <button class="service-card">PAN Card</button>
            <button class="service-card">Residence Certificate</button>
        </div>
    </section>

    <!-- Loans & Financial Support -->
    <section class="category">
        <h2>Loans & Financial Support</h2>
        <div class="service-grid">
            <button class="service-card">Education Loan</button>
            <button class="service-card">Home Loan</button>
            <button class="service-card">Mudra Loan</button>
            <button class="service-card">Personal Loan</button>
        </div>
    </section>

    <!-- Health & Insurance -->
    <section class="category">
        <h2>Health & Insurance</h2>
        <div class="service-grid">
            <button class="service-card">Health Card</button>
            <button class="service-card">Health Insurance</button>
            <button class="service-card">Maternity Benefit Scheme</button>
        </div>
    </section>

    <!-- Agriculture & Rural Support -->
    <section class="category">
        <h2>Agriculture & Rural Support</h2>
        <div class="service-grid">
            <button class="service-card">Crop Insurance</button>
            <button class="service-card">Flood Relief Assistance</button>
        </div>
    </section>

    <!-- Women & Social Welfare -->
    <section class="category">
        <h2>Women & Social Welfare</h2>
        <div class="service-grid">
            <button class="service-card">Mahila Samman Savings Scheme</button>
            <button class="service-card">Women Startup Schemes</button>
        </div>
    </section>

    <!-- Business & Trade -->
    <section class="category">
        <h2>Business & Trade</h2>
        <div class="service-grid">
            <button class="service-card">Trade License</button>
        </div>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
